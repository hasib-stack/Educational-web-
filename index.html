<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Study Community</title>

<link rel="stylesheet"
href="style.css">

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js">
</script>

</head>

<body>

<header>

<h1>📚 Study Community</h1>

<button id="darkBtn">
🌙
</button>

</header>

<div class="container">

<div id="authBox">

<input type="email"
id="email"
placeholder="Email">

<input type="password"
id="password"
placeholder="Password">

<button onclick="signup()">
Signup
</button>

<button onclick="login()">
Login
</button>

</div>

<div id="app" style="display:none;">

<div class="postBox">

<textarea
id="caption"
placeholder="Share your study...">
</textarea>

<input type="file"
id="image">

<button onclick="createPost()">
📤 Post
</button>

</div>

<h2>🔥 Leaderboard</h2>

<div id="leaderboard"></div>

<h2>📡 Live Posts</h2>

<div id="posts"></div>

</div>

</div>

<script src="supabase.js"></script>
<script src="app.js"></script>

</body>
  </html>
